# Vaihtoehto ilman erillistä gunicornia: mod_wsgi (apt install libapache2-mod-wsgi-py3).
# Flask-sovellus ajetaan Apachen sisällä; käyttöliittymä kuten apache-sporssi.conf:ssa.

WSGIDaemonProcess sporssi python-home=/opt/sporssi/.venv python-path=/opt/sporssi/server
WSGIScriptAlias /sporssi/api /opt/sporssi/server/wsgi.py process-group=sporssi
<Directory /opt/sporssi/server>
    <Files wsgi.py>
        Require all granted
    </Files>
</Directory>
SetEnv SPORSSI_DB /var/lib/sporssi/sporssi.sqlite3
