# Sporssi mod_wsgi:llä (apt install libapache2-mod-wsgi-py3). Flask ajetaan Apachen sisällä;
# käyttöliittymä kopioidaan staattisena kuten apache-sporssi.conf:ssa.
#
# Asetukset (SPORSSI_DB, ENTSOE_TOKEN ...) tiedostoon /etc/sporssi.env tai /opt/sporssi/sporssi.env.
# Apachen SetEnv EI välity mod_wsgi-sovelluksen os.environiin.
#
# Daemon-prosessi ajetaan käyttäjänä www-data: sillä on oltava kirjoitusoikeus
# tietokannan hakemistoon (esim. sudo install -d -o www-data /var/lib/sporssi).
#
# Koodin päivityksen jälkeen: sudo touch /opt/sporssi/server/wsgi.py  (lataa daemonin uudelleen)
# Tarkistus: https://palvelin/sporssi/api/health

WSGIDaemonProcess sporssi user=www-data group=www-data processes=1 threads=8 \
    python-home=/opt/sporssi/.venv python-path=/opt/sporssi/server
WSGIScriptAlias /sporssi/api /opt/sporssi/server/wsgi.py process-group=sporssi application-group=%{GLOBAL}
<Directory /opt/sporssi/server>
    <Files wsgi.py>
        Require all granted
    </Files>
</Directory>
