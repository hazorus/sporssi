# Sporssi Apachessa: käyttöliittymä staattisina tiedostoina, /sporssi/api välitetään Flaskille.
# Tarvittavat moduulit:  a2enmod proxy proxy_http headers
#
# 1) Käyttöliittymä:  cd web && npm ci && npm run build
#                     rsync -a --delete dist/ /var/www/html/sporssi/
#    (config.js:n apiBase "api" osoittaa tällöin /sporssi/api/ -polkuun)
# 2) Palvelin: ks. deploy/sporssi.service (gunicorn kuuntelee 127.0.0.1:8050)
# 3) Lisää alla oleva VirtualHostin sisään tai conf-available/sporssi.conf ja a2enconf sporssi

<Directory /var/www/html/sporssi>
    AllowOverride FileInfo
    Options -Indexes
</Directory>

ProxyPass        /sporssi/api/ http://127.0.0.1:8050/api/
ProxyPassReverse /sporssi/api/ http://127.0.0.1:8050/api/
